[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swaras"
version = "0.1.0"
description = "Audio-to-Swar: transcribe a melodic recording as Indian swar notation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Essentia provides the default pitch tracker and the tonic corroboration
# model. It is a native package with prebuilt wheels for Linux and macOS only,
# so it cannot be a hard dependency: on Windows it needs WSL or Docker, and
# without it the pipeline still runs on librosa pYIN.
essentia = ["essentia>=2.1b5"]
# Everything a contributor needs: the tests, the plots and the API tests.
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "essentia>=2.1b5",
]

[project.scripts]
swar = "swaras.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swaras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel.force-include]
"src/swaras/config/shruti_table.json" = "swaras/config/shruti_table.json"
"src/swaras/web/index.html" = "swaras/web/index.html"
"src/swaras/web/app.js" = "swaras/web/app.js"
"src/swaras/web/style.css" = "swaras/web/style.css"
